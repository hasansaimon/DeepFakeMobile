kind = "mobile"
previewPath = "/mobile/"
title = "Deepfake Studio"
version = "1.0.0"
id = "artifacts/deepfake-studio-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20194

[services.development]
run = "pnpm --filter @workspace/deepfake-studio-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deepfake-studio-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/deepfake-studio-mobile", "run", "serve" ]

[services.env]
PORT = "20194"
BASE_PATH = "/mobile/"
